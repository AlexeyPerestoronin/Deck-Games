<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ deck.title }} — рубашка</title>
  <style>
    {% include 'card-back.scss' %}
  </style>
</head>
<body>
  <article class="card-back" style="width: {{ deck.card_width_mm }}mm; height: {{ deck.card_height_mm }}mm;">
    <div class="mud"></div>
    <div class="badge">
      <div class="snout" aria-hidden="true"></div>
      <div class="t">{{ deck.title }}</div>
      <div class="s">{{ deck.subtitle }}</div>
      <div class="n">{{ deck.card_count }}</div>
    </div>
  </article>
</body>
</html>
