<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Корова 006 — рубашка</title>
  <style>
@page {
  size: 62mm 84mm;
  margin: 0;
}
html,
body {
  margin: 0;
  padding: 0;
  width: 62mm;
  height: 84mm;
  background: #fff;
}

.card-back {
  position: relative;
  box-sizing: border-box;
  overflow: hidden;
  border-radius: 3mm;
  background: #5a7a32;
  color: #f4efe4;
  font-family: "Palatino Linotype", Palatino, Georgia, serif;
  border: 0.6mm solid #2b2118;
}
.card-back .field {
  position: absolute;
  inset: 3mm;
  border: 0.45mm dashed rgba(244, 239, 228, 0.45);
  background: repeating-linear-gradient(90deg, transparent 0 8mm, rgba(0, 0, 0, 0.06) 8mm 8.4mm), repeating-linear-gradient(0deg, transparent 0 11mm, rgba(255, 255, 255, 0.05) 11mm 11.4mm);
}
.card-back .stamp {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 42mm;
  text-align: center;
}
.card-back .bull {
  width: 14mm;
  height: 11mm;
  margin: 0 auto 3mm;
  background: #f4efe4;
  border-radius: 50% 50% 46% 46%;
  position: relative;
}
.card-back .bull::before,
.card-back .bull::after {
  content: "";
  position: absolute;
  width: 4mm;
  height: 7mm;
  background: #f4efe4;
  border-radius: 80% 0 40% 40%;
  top: -4mm;
}
.card-back .bull::before {
  left: -1mm;
  transform: rotate(-30deg);
}
.card-back .bull::after {
  right: -1mm;
  transform: scaleX(-1) rotate(-30deg);
}
.card-back .num {
  font-size: 22pt;
  font-weight: 700;
  letter-spacing: 0.12em;
}
.card-back .title {
  font-size: 11pt;
  margin-top: 1mm;
}
.card-back .sub {
  font-size: 7pt;
  opacity: 0.85;
  margin-top: 1mm;
}  </style>
</head>
<body>
  <article class="card-back" style="width: 62.0mm; height: 84.0mm;">
    <div class="field"></div>
    <div class="stamp">
      <div class="bull" aria-hidden="true"></div>
      <div class="num">006</div>
      <div class="title">Корова 006</div>
      <div class="sub">Take 6! &#x2f; 6 nimmt!</div>
    </div>
  </article>
</body>
</html>
