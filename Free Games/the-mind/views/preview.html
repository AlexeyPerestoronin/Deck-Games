<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Превью — {{ deck.title }}</title>
  <style>
    body { margin: 0; padding: 12mm; background: #05060a; color: #e8e6df; font-family: "Segoe UI", sans-serif; }
    h1 { font-size: 18pt; font-weight: 300; margin: 0 0 6mm; }
    .gallery { display: flex; flex-wrap: wrap; gap: 8mm; }
    iframe { border: 0; background: #000; }
    .faces { width: {{ deck.card_width_mm }}mm; height: {{ cards|length * deck.card_height_mm }}mm; }
    .back { width: {{ deck.card_width_mm }}mm; height: {{ deck.card_height_mm }}mm; }
  </style>
</head>
<body>
  <h1>{{ deck.category }} — {{ deck.title }} ({{ cards|length }})</h1>
  <div class="gallery">
    <iframe class="faces" src="face.html" title="Лицо"></iframe>
    <iframe class="back" src="back.html" title="Рубашка"></iframe>
  </div>
</body>
</html>
