<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Mind — превью</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #07080b; color: #d8d6cf; font-family: "Segoe UI", Arial, sans-serif; }
    body { min-height: 100vh; }
    .page { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    .mute {
      letter-spacing: 0.55em;
      text-transform: uppercase;
      font-size: 11px;
      opacity: 0.45;
      margin: 0 0 12px;
    }
    h1 {
      font-weight: 200;
      font-size: 48px;
      margin: 0 0 10px;
    }
    .line {
      height: 1px;
      background: linear-gradient(90deg, transparent, #d8d6cf, transparent);
      margin: 24px 0 36px;
      opacity: 0.25;
    }
    .axis {
      position: relative;
      padding-left: 28px;
      border-left: 1px solid rgba(216,214,207,0.2);
    }
    .beat {
      position: relative;
      margin: 0 0 36px;
    }
    .beat::before {
      content: "";
      position: absolute;
      left: -32px;
      top: 12px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d8d6cf;
    }
    .when {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.4;
      margin: 0 0 10px;
    }
    iframe {
      width: 60mm;
      height: 91mm;
      border: 0;
      display: block;
      background: #000;
      box-shadow: 0 0 0 1px #2a2e38;
    }
    .whisper {
      margin-top: 40px;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.7;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="mute">не говорить</p>
    <h1>The Mind</h1>
    <div class="line"></div>
    <div class="axis">
      <div class="beat">
        <div class="when">сначала</div>
        <iframe src="card-1-face.html" title="1"></iframe>
      </div>
      <div class="beat">
        <div class="when">пауза</div>
        <iframe src="card-2-face.html" title="34"></iframe>
      </div>
      <div class="beat">
        <div class="when">ещё тише</div>
        <iframe src="card-3-face.html" title="67"></iframe>
      </div>
      <div class="beat">
        <div class="when">конец уровня</div>
        <iframe src="card-4-face.html" title="100"></iframe>
      </div>
    </div>
    <p class="whisper">Одна стопка. Только возрастание. Никто не кивает и не смотрит на часы нарочно — вы просто ждёте, пока чужая рука не решит, что её число уже меньше.</p>
  </div>
</body>
</html>
