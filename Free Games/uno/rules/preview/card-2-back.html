<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Уно — рубашка</title>
  <style>
@page {
  size: 58mm 88mm;
  margin: 0;
}
html,
body {
  margin: 0;
  padding: 0;
  width: 58mm;
  height: 88mm;
  background: #fff;
}

.card-back {
  position: relative;
  box-sizing: border-box;
  overflow: hidden;
  border-radius: 4mm;
  background: #111;
  font-family: Arial, Helvetica, sans-serif;
}
.card-back .quad {
  position: absolute;
  width: 50%;
  height: 50%;
}
.card-back .q-red {
  top: 0;
  left: 0;
  background: #e0192c;
}
.card-back .q-yellow {
  top: 0;
  right: 0;
  background: #f5d000;
}
.card-back .q-green {
  bottom: 0;
  left: 0;
  background: #1f9a3f;
}
.card-back .q-blue {
  bottom: 0;
  right: 0;
  background: #1d6fd1;
}
.card-back .oval {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 36mm;
  height: 52mm;
  transform: translate(-50%, -50%) rotate(-18deg);
  background: #111;
  border: 1.1mm solid #fff;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.card-back .word {
  transform: rotate(18deg);
  font-size: 18pt;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.card-back .count {
  transform: rotate(18deg);
  margin-top: 2mm;
  font-size: 7pt;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.8;
}  </style>
</head>
<body>
  <article class="card-back" style="width: 58.0mm; height: 88.0mm;">
    <div class="quad q-red"></div>
    <div class="quad q-yellow"></div>
    <div class="quad q-green"></div>
    <div class="quad q-blue"></div>
    <div class="oval">
      <div class="word">Уно</div>
      <div class="count">108 карт</div>
    </div>
  </article>
</body>
</html>
